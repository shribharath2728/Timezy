version: '3.8'

services:
  mongo:
    image: mongo:7.0
    restart: always
    # ⚠️ Port NOT exposed to host — services communicate on the internal Docker network only.
    # Exposing 27017 to the host in production is a critical security risk.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-mongoadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}
      MONGO_INITDB_DATABASE: event_planner_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      # MongoDB URI uses authenticated credentials set above
      - MONGODB_URI=mongodb://${MONGO_ROOT_USER:-mongoadmin}:${MONGO_ROOT_PASSWORD}@mongo:27017/event_planner_db?authSource=admin
      - GEMINI_API_KEY=${GEMINI_API_KEY:?GEMINI_API_KEY must be set}
      # ⚠️  Override these in production — defaults are publicly known weak values
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - TOKEN_ENC_KEY=${TOKEN_ENC_KEY:?TOKEN_ENC_KEY must be set}
      - TICK_TOKEN=${TICK_TOKEN:?TICK_TOKEN must be set}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

volumes:
  mongo_data:
